name: alyz_whatsapp
description: Secure WhatsApp Flutter Project in Neubrutalism Design.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Versi Firebase yang lebih aman untuk minSdk 21
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.5
  firebase_database: ^10.4.9
  firebase_app_check: ^0.2.1+7
  
  encrypt: ^5.0.3
  crypto: ^3.0.6
  flutter_dotenv: ^5.2.1
  
  # Plugin pendukung versi lawas yang ramah Android 21
  permission_handler: ^11.3.1
  image_picker: ^1.0.7
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  flutter_contacts: ^1.1.9
  
  # Agora versi stabil di bawah v6 agar tidak rewel minta minSdk tinggi
  agora_rtc_engine: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  