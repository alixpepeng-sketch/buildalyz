name: alyz_whatsapp
description: Secure WhatsApp Flutter Project in Neubrutalism Design.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  firebase_database: ^10.4.0
  firebase_app_check: ^0.2.1+1
  encrypt: ^5.0.3
  crypto: ^3.0.3
  flutter_dotenv: ^5.1.0
  permission_handler: ^11.3.1
  image_picker: ^1.0.7
  agora_rtc_engine: ^6.3.3
  flutter_contacts: ^1.1.9+1
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
