plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.alyz.whatsapp"
    compileSdk 34 // Disinkronkan agar kompatibel dengan plugin lawas
    ndkVersion "26.1.10909125"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.alyz.whatsapp"
        minSdk 21 // Agar bisa di-install di HP Android 21 lu
        targetSdk 34 // Disinkronkan dengan compileSdk
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true // Wajib buat handle banyak plugin di SDK 21
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'androidx.multidex:multidex:2.0.1'
}
