      - name: Clean Cache & Lockfiles
        run: |
          rm -rf .dart_tool
          rm -f pubspec.lock
          flutter clean

      - name: Flutter pub get
        run: flutter pub get

      - name: Replacing Package
        run: |
          set -e
          echo "$PKG" | grep -Eq '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$' || { echo "Package name tidak valid: $PKG"; exit 1; }
          GRADLE=$(ls android/app/build.gradle android/app/build.gradle.kts 2>/dev/null | head -n1)
          sed -i -E "s/(applicationId[[:space:]]*=?[[:space:]]*)\"[^\"]*\"/\1\"$PKG\"/" "$GRADLE"
          APP_CLEAN=$(printf '%s' "$APP_NAME" | tr -cd 'A-Za-z0-9 _-')
          [ -z "$APP_CLEAN" ] && APP_CLEAN="Alyz App"
          sed -i -E "s|android:label=\"[^\"]*\"|android:label=\"$APP_CLEAN\"|" android/app/src/main/AndroidManifest.xml
          grep -n "applicationId" "$GRADLE"

      # --- TAMBAHKAN STEP INI UNTUK MENAMBAL ERROR LOG ---
      - name: Fix GeneratedPluginRegistrant Log Error
        run: |
          REGISTRANT_FILE=$(find android -name "GeneratedPluginRegistrant.java" | head -n 1)
          if [ -f "$REGISTRANT_FILE" ]; then
            echo "Menemukan GeneratedPluginRegistrant.java, menyisipkan import Log..."
            # Tambahkan import io.flutter.Log jika belum ada
            if ! grep -q "import io.flutter.Log;" "$REGISTRANT_FILE"; then
              sed -i '/import io.flutter.embedding.engine.FlutterEngine;/a import io.flutter.Log;' "$REGISTRANT_FILE"
            fi
          fi
      # ---------------------------------------------------

      - name: Building APK
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
        
