name: Build APK
run-name: Build APK ${{ inputs.requestId || github.sha }}

on:
  push:
  workflow_dispatch:
    inputs:
      packageName:
        description: 'Package name (applicationId)'
        required: false
        default: 'com.alyz.app'
      appName:
        description: 'Nama aplikasi'
        required: false
        default: 'Alyz App'
      requestId:
        description: 'ID request dari web (untuk pencocokan run)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PKG: ${{ inputs.packageName || 'com.alyz.app' }}
      APP_NAME: ${{ inputs.appName || 'Alyz App' }}
    steps:
      - name: Cloning repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Flutter 3.22.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Prepare Android folder
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android .
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Replacing Package
        run: |
          set -e
          echo "$PKG" | grep -Eq '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$' || { echo "Package name tidak valid: $PKG"; exit 1; }
          GRADLE=$(ls android/app/build.gradle android/app/build.gradle.kts 2>/dev/null | head -n1)
          # Hanya applicationId yang diganti (ID aplikasi di perangkat). namespace/kode Kotlin tidak diubah
          # agar MainActivity tetap ter-resolve dan file Dart tidak terpengaruh.
          sed -i -E "s/(applicationId[[:space:]]*=?[[:space:]]*)\"[^\"]*\"/\1\"$PKG\"/" "$GRADLE"
          APP_CLEAN=$(printf '%s' "$APP_NAME" | tr -cd 'A-Za-z0-9 _-')
          [ -z "$APP_CLEAN" ] && APP_CLEAN="Alyz App"
          sed -i -E "s|android:label=\"[^\"]*\"|android:label=\"$APP_CLEAN\"|" android/app/src/main/AndroidManifest.xml
          grep -n "applicationId" "$GRADLE"

      - name: Building APK
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols

      - name: Publishing Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ${{ inputs.appName || 'Alyz App' }} build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/*.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/*.apk
