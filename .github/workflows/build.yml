name: Build Alyz APK Secure

on: 
  push: 
    branches: [main]
  workflow_dispatch: # Tambahkan ini agar bisa di-trigger manual

jobs: 
  build: 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4 
        with: 
          java-version: '21'
          distribution: 'temurin'
          
      - uses: subosito/flutter-action@v2 
        with: 
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true
          
      - name: Decode google-services.json from Secret 
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json
        
      - run: flutter pub get
      
      - run: flutter build apk --release --obfuscate --split-debug-info=./symbols
      
      - uses: actions/upload-artifact@v4 
        with: 
          name: alyz-apk-secure
          path: build/app/outputs/flutter-apk/app-release.apk
          
      - name: Cleanup secrets 
        if: always() 
        run: rm -f android/app/google-services.json
        
